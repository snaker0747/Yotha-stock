<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ระบบการเบิกจ่ายวัสดุ</title>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="app-frame" src="https://script.google.com/macros/s/AKfycbwC3xveGqgNQrVpNG3gQOK3nuAFT6D6j2uNn8xZl6BoMZj7zg58i3Xot3Fbb7czQIAg0Q/exec" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
  <script>
    window.addEventListener('message', function(e) {
      if (!e.data || !e.data.type) return;
      if (e.data.type === 'SET_DATA') {
        localStorage.setItem(e.data.key, e.data.value);
      } else if (e.data.type === 'REMOVE_DATA') {
        localStorage.removeItem(e.data.key);
      } else if (e.data.type === 'INIT_STORAGE') {
        var data = {};
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          data[k] = localStorage.getItem(k);
        }
        e.source.postMessage({ type: 'STORAGE_SYNC', data: data }, '*');
      }
    });
  </script>
</body>
</html>
